services:
  postgres:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    # Teto anti-100%: o fork nunca sozinho throttla o host. Pico medido em idle ~9% CPU/90M;
    # 1 CPU + 2G deixa folga ampla sem deixar o banco esmagar nem ser esmagado.
    cpus: "1.0"
    mem_limit: 2g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "x", "drizzle-kit", "migrate", "--config=drizzle.config.ts"]
    environment:
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The Bot's computer is long-lived so browser sessions remain signed in across turns.
  agent-computer:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    build:
      context: .
      dockerfile: agent-computer/Dockerfile
    # Tagged explicitly because the supervisor starts one computer per Bot from this image by name,
    # and a Compose-derived name would change with the project.
    image: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
    ports:
      # Loopback only. This process drives a browser holding real logins; COMPUTER_TOKEN is the
      # request control, and loopback keeps the surface off routed networks.
      - "127.0.0.1:${COMPUTER_PORT:-4100}:4100"
    environment:
      # The secret every caller must present. The container refuses to start without it.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
    volumes:
      - agent-workspace:/workspace
      # Chromium's user-data directory is volume-backed so logins survive container restarts.
      - agent-profiles:/profiles
    # Gives Chromium time to flush its profile after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      # `r.ok`, não só o fetch: o `/health` responde 503 quando o volume de perfis não é gravável, e
      # um fetch que resolve sem erro trataria isso como saudável.
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:4100/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bot identity is attested by SPIRE when these optional services run.
  #
  # SPIRE issues each computer an SVID based on the container labels set by the supervisor. A
  # computer cannot claim another Bot's identity, and an unregistered container receives no identity.
  #
  # Optional. Without these two services the product runs without workload identity and reports that
  # state explicitly.
  # Fresh named volumes arrive owned by root, while SPIRE runs as uid 1000. This one-shot service
  # assigns ownership without running the CA or agent as root.
  spire-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 1000:1000 /server /agent"]
    user: "0:0"
    volumes:
      - spire-server-data:/server
      - spire-agent-data:/agent

  spire-server:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    image: ghcr.io/spiffe/spire-server:1.15.1
    depends_on:
      spire-init:
        condition: service_completed_successfully
    command: ["-config", "/opt/spire/conf/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server.conf:ro
      # Mounted at the directory the image already owns so SPIRE can create its datastore as uid 1000.
      - spire-server-data:/opt/spire/data
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  spire-agent:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    image: ghcr.io/spiffe/spire-agent:1.15.1
    command: ["-config", "/opt/spire/conf/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-openbot-dev-token}"]
    # The agent must see the caller's process to map the Workload API peer to a Docker container. The
    # host PID namespace is required because the attestor reads the peer cgroup from that pid.
    pid: host
    depends_on:
      spire-server:
        condition: service_healthy
      spire-init:
        condition: service_completed_successfully
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent.conf:ro
      - spire-agent-socket:/tmp/spire-agent/public
      - spire-agent-data:/opt/spire/data
      # Read-only, and only so the docker workload attestor can see which container is asking.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # One computer per Bot.
  #
  # Each Bot gets a container with its own files, browser session and processes. The Docker socket is
  # root-equivalent on the host, so only the supervisor holds it and only exposes Bot-level verbs.
  # The SPIRE agent mounts the socket read-only to attest workloads and creates nothing.
  supervisor:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    environment:
      PORT: "4300"
      # Shared with the API server. The Bot-level verb set is the boundary; this token keeps other
      # services on the network from calling those verbs.
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-}
      # Handed to every computer this creates, so the server and the computers share one secret.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-openbot-agent-computer:latest}
      # Which deployment the computers it creates belong to, so two stacks on one Docker host never
      # derive the same container and volume names for the same Bot.
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-openbot}
      # Empty by default because the API server runs on the host in local development and reaches
      # computers by published loopback ports. Deployments running the server inside this network set
      # the network name so computers publish no host ports.
      COMPUTER_NETWORK: ${COMPUTER_NETWORK:-}
      # Set to runsc to run every computer under gVisor, when the host has it. Left unset each
      # computer is an ordinary container and shares the host kernel.
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
      # How many computers may be live at once. Six residents, one per sector, and no seventh
      # browser on the host; size this against the VPS, not optimism.
      COMPUTER_MAX_COMPUTERS: ${COMPUTER_MAX_COMPUTERS:-6}
      # Sector ids this supervisor admits, when the deployment places computers into sectors. Unset,
      # requests are admitted on capacity alone, which is the laptop shape.
      COMPUTER_SECTORS: ${COMPUTER_SECTORS:-}
      # Memory cap per computer in bytes. Unset, a runaway Bot is a resource problem for itself
      # only up to the host's mercy; set, Docker OOM-kills that computer instead.
      COMPUTER_MEMORY_BYTES: ${COMPUTER_MEMORY_BYTES:-}
      # Identity, when SPIRE is part of this deployment. The supervisor registers an entry per Bot
      # and mounts the agent's socket into that Bot's computer so it can fetch its own SVID.
      SPIRE_SOCKET: /tmp/spire-server/private/api.sock
      SPIRE_TRUST_DOMAIN: openbot.local
      SPIRE_AGENT_ID: spiffe://openbot.local/spire/agent/join_token/${SPIRE_JOIN_TOKEN:-openbot-dev-token}
      SPIRE_AGENT_SOCKET_VOLUME: ${COMPOSE_PROJECT_NAME:-openbot}_spire-agent-socket
    ports:
      # For the server on the host to ask for a Bot's computer.
      - "${SUPERVISOR_PORT:-4500}:4300"
    volumes:
      # Read-only because this service only ever needs to ask; it is still root-equivalent, which is
      # the whole reason nothing else here gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # To register an entry per Bot as each computer is created.
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4300/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The built-in Bot is an AG-UI endpoint registered the same way as a customer-provided Bot.
  agent-bot:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    build:
      context: .
      dockerfile: agent-bot/Dockerfile
    ports:
      # Loopback, not every interface. The token is the boundary; this means an attacker needs to be
      # on the machine before they can even try it. Nothing legitimate reaches a Bot from another
      # host: the server calls it over localhost, and other containers use the compose network.
      - "127.0.0.1:${BOT_PORT:-4200}:4200"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Server sends this on every call to the managed Bot. It refuses to start without it.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # Unset means OpenAI. Set, it is any endpoint speaking the same API, and BOT_MODEL is sent
      # to it verbatim.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BOT_MODEL: ${BOT_MODEL:-gpt-5.5}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The product itself: the React app, the API, and the browser the Bots drive, in the one image the
  # root Dockerfile builds. Upstream runs these with `scripts/start.sh`, which is a development
  # topology — nothing restarts it and nothing brings it back after a reboot. A deployment that is
  # meant to stay up needs it here, beside everything else it depends on.
  openbot:
    build:
      context: .
      dockerfile: Dockerfile
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    # Teto anti-100%: Chromium em rajada + 4 vCPU no host. Idle ~5% CPU/500M; 3 CPU + 6G
    # deixa folga ~6x sem OOM em turno normal. Healthcheck com start_period 60s sobrevive.
    cpus: "3.0"
    mem_limit: 6g
    mem_reservation: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Loopback. Reached over an SSH tunnel, or by a reverse proxy on this host that terminates TLS.
      # Published on any interface it would be an administrator console on the open internet, which
      # with OPENBOT_SINGLE_USER is exactly as bad as it sounds.
      - "127.0.0.1:${OPENBOT_PORT:-3001}:3001"
    # O .env inteiro, e não uma lista escolhida a dedo.
    #
    # Enumerar variáveis aqui já custou uma sessão de depuração: AGENT_STALL_TIMEOUT_MS estava no
    # .env, não estava na lista, e o servidor caiu no padrão — todo turno do Codex morria no meio sem
    # nada dizer por quê. O que o servidor lê é o .env; o bloco abaixo só sobrescreve o que muda por
    # se estar dentro de um container.
    env_file:
      - .env
    environment:
      # The database is the compose one, reached by service name rather than through the host's
      # loopback mapping.
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
      EMBEDDED_POSTGRES: "off"
      RUNTIME_MODE: ${RUNTIME_MODE:-local}
      COPILOTKIT_TELEMETRY_DISABLED: ${COPILOTKIT_TELEMETRY_DISABLED:-true}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      # Service name, not localhost: inside this container localhost is this container.
      MANAGED_AGENT_AG_UI_URL: http://agent-codex:4202/ag-ui
      OPENBOT_SINGLE_USER: ${OPENBOT_SINGLE_USER:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3001}
      # Empty, not a default. These two are half of the sign-in contract, and the server refuses to
      # boot when they are set with no identity provider behind them — which is exactly what a
      # helpful-looking default here produced. They come from .env or they do not come at all.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      TENANT_PACKAGE_DIR: ${TENANT_PACKAGE_DIR:-/app/examples/fintech}
      # Onde o motor sem pixels atende. Ausente, a ação fetch responde que não pôde ser alcançado.
      LIGHTPANDA_CDP_URL: ${LIGHTPANDA_CDP_URL:-ws://lightpanda:9222}
      # As capturas de uma tarefa, num volume nomeado.
      #
      # Dentro do container, `./.artifacts` vive no sistema de arquivos efêmero: um `docker compose
      # up --build` apagaria as evidências de todas as tarefas, que é justamente o que a retenção por
      # linha promete guardar. O diretório é do volume, e a retenção continua sendo uma coluna.
      #
      # O dono de um volume novo vem do diretório da imagem (`Dockerfile`): a API roda como `pwuser`,
      # e sem aquele `chown` a primeira captura falharia com EACCES.
      AGENT_ARTIFACTS_DIR: /app/.artifacts
    volumes:
      - agent-artifacts:/app/.artifacts
    depends_on:
      postgres:
        condition: service_healthy
      agent-codex:
        condition: service_started
      lightpanda:
        condition: service_started
    healthcheck:
      # Os dois lados: a API e o computador que vive dentro deste container. Um volume de perfis com
      # o dono errado deixa a API de pé e o navegador inutilizável, e o healthcheck que só olhasse a
      # API manteria o serviço "healthy" nesse estado.
      test: ["CMD-SHELL", "bun -e \"const check = async (u) => (await fetch(u)).ok; process.exit((await check('http://localhost:3001/health')) && (await check('http://localhost:4100/health')) ? 0 : 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # O segundo motor de navegador: sem pixels, para as páginas que ninguém assiste.
  #
  # Não substitui o Chromium que vive na imagem `openbot`. O Lightpanda não tem motor gráfico —
  # `Page.captureScreenshot` devolve um PNG de aviso e `Page.startScreencast` não existe —, então
  # tudo que a pessoa vê acontecer continua sendo Chromium. Ele serve a ação `fetch`: ler uma página
  # e devolver o texto, por uma fração da memória.
  lightpanda:
    build:
      context: ./lightpanda
      dockerfile: Dockerfile
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    environment:
      # O binário reporta uso ao projeto por padrão. Este deployment existe para não mandar nada a
      # ninguém, e isto é a mesma decisão tomada para a telemetria do CopilotKit.
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "1"
    # Bind em 0.0.0.0 para os outros containers alcançarem, e é só isso que este comando decide.
    #
    # Quem chama tem de mandar `Host: 127.0.0.1:9222`, porque o CDP valida o Host que recebe — a
    # mesma proteção contra DNS rebinding que o Chrome faz — e com bind em curinga o único Host que
    # ele aceita é o loopback que anuncia. Medido um por um: 127.0.0.1 abre, `localhost` e o nome do
    # serviço são recusados com "Expected 101". Ligar direto ao nome do serviço também não serve: o
    # processo não sobe. Ver agent-computer/src/lightpanda.ts.
    command:
      - lightpanda
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "9222"
      - --obey-robots
      - --log-level
      - warn
    # Sem `ports`: só quem está na rede do compose alcança. Um CDP aberto é o controle do navegador.
    expose:
      - "9222"
    healthcheck:
      # A porta aceita conexão, e nada além disso. Um GET comum devolve 400 — o protocolo dele é
      # WebSocket, e `curl -f` lia esse 400 como serviço doente enquanto ele atendia normalmente.
      test:
        ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9222' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The Bot whose model is the Codex CLI, driven by the ChatGPT subscription signed in on this host.
  # No API key: see agent-codex/src/index.ts for why a subprocess is the only way a subscription can
  # drive a deployment.
  agent-codex:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    # Teto anti-100%: subprocesso Node por turno em voo. Idle ~0.4%/230M; 2 CPU + 4G
    # nunca OOM em turno normal.
    cpus: "2.0"
    mem_limit: 4g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: agent-codex/Dockerfile
    ports:
      # Loopback, for the same reason as agent-bot above.
      - "127.0.0.1:${CODEX_BOT_PORT:-4202}:4202"
    environment:
      # Same server-to-Bot request boundary as agent-bot above.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_EFFORT: ${CODEX_EFFORT:-}
      # workspace-write or read-only. danger-full-access is refused by the service itself.
      CODEX_SANDBOX: ${CODEX_SANDBOX:-workspace-write}
      CODEX_TURN_TIMEOUT_MS: ${CODEX_TURN_TIMEOUT_MS:-900000}
      # O que dá ao Codex o navegador do Bot. Presente, ele ganha as ferramentas de computador via
      # MCP e cada uma passa pela política e pela auditoria; ausente, ele só conversa.
      OPENBOT_AGENT_TOKEN: ${AGENT_TOOL_TOKEN:-}
      OPENBOT_API_URL: ${OPENBOT_API_URL:-http://openbot:3001}
    volumes:
      # The credential and the AG-UI-thread-to-Codex-session map. Survives a rebuild; back it up and
      # you have backed up the Bot's sign-in.
      - codex-state:/state
      # The only directory the sandbox may write to.
      - codex-workspace:/workspace
    healthcheck:
      # `r.ok`, e não só `fetch`. Sem isso o teste passava com qualquer resposta, inclusive a que diz
      # que o Bot subiu SEM navegador — e um Bot sem ferramentas continua atendendo e respondendo
      # bem, de memória. O `start_period` dá tempo do probe de boot terminar antes de valer.
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:4202/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # The same Bot behavior on OpenCode, exposed as another AG-UI endpoint and registry row.
  # Um CLI de agente como Bot: o modelo É o CLI, e a conta dele é a que o deployment configurou.
  #
  # Existe porque um CLI já traz conta, modelo e laço de ferramentas prontos — o "OpenCode Go" de
  # alguém, um modelo gratuito — e o runtime só precisa entregar a tarefa e ler o resultado. Mesmo
  # desenho do agent-codex; o que muda é que aqui o CLI é o OpenCode, não código.
  agent-cli:
    restart: unless-stopped
    # Teto anti-100%: mesmo desenho do agent-codex.
    cpus: "2.0"
    mem_limit: 4g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: agent-cli/Dockerfile
    ports:
      # Loopback, for the same reason as agent-bot above.
      - "127.0.0.1:${CLI_BOT_PORT:-4210}:4210"
    # O .env inteiro, pela mesma razão do openbot: a conta e as chaves de provedor que o CLI conhece
    # entram por aqui, sem uma lista enumerada que envelhece. O bloco abaixo só sobrescreve o que
    # muda por se estar dentro de um container.
    env_file:
      - .env
    environment:
      # Same server-to-Bot request boundary as agent-bot above.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # A porta DESTE serviço, fixada aqui de propósito.
      #
      # O `.env` do deployment tem PORT=3001, do servidor, e o `env_file` o traz para dentro. Medido:
      # sem esta linha o CLI sobe ouvindo na porta do outro serviço e o healthcheck morre onde nada
      # escuta — um container de pé que ninguém alcança.
      PORT: 4210
      # O OpenCode; outro valor recusa no boot.
      AGENT_CLI: ${AGENT_CLI:-opencode}
      # O modelo, no formato do CLI (`provider/model`). Vazio deixa o CLI escolher o padrão dele.
      AGENT_CLI_MODEL: ${AGENT_CLI_MODEL:-}
      # O degrau de raciocínio do modelo (`high`, `max`, `minimal`), no vocabulário do fornecedor.
      # Vazio deixa o CLI no padrão dele.
      AGENT_CLI_VARIANT: ${AGENT_CLI_VARIANT:-}
      AGENT_CLI_TURN_TIMEOUT_MS: ${AGENT_CLI_TURN_TIMEOUT_MS:-900000}
      # A conta do CLI em base64 — o mesmo arquivo que `opencode auth login` escreve. Nunca é
      # impressa; vira o arquivo de credencial no volume, com permissão 600.
      AGENT_CLI_AUTH_JSON: ${AGENT_CLI_AUTH_JSON:-}
      # O que dá ao CLI o navegador do Bot, via MCP, com cada chamada passando pela política e pela
      # auditoria. Ausente, o CLI só conversa.
      OPENBOT_AGENT_TOKEN: ${AGENT_TOOL_TOKEN:-}
      # Onde fica o gateway. Dentro de um compose inteiro é o nome do serviço; com o servidor rodando
      # na máquina (o fluxo do `scripts/start.sh`), é `host.docker.internal`, e por isso a variável
      # existe em vez de o endereço estar escrito aqui — o mesmo motivo da linha do agent-codex.
      OPENBOT_API_URL: ${OPENBOT_API_URL:-http://openbot:3001}
    extra_hosts:
      # Para o caso do servidor na máquina, que é como o deployment local roda.
      - "host.docker.internal:host-gateway"
    volumes:
      # A credencial e as sessões do CLI: sobrevive a um rebuild, e é o que faz o segundo turno
      # lembrar do primeiro.
      - agent-cli-state:/state
      # Onde o Bot escreve o que a pessoa recebe — relatórios, planilhas, o que a tarefa pediu.
      - agent-cli-workspace:/workspace
    healthcheck:
      # 503 quando o CLI ainda não confirmou as ferramentas, e não 200 por estar de pé: um Bot sem
      # navegador conversa, e é a assinatura dos defeitos caros deste fork.
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:4210/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  agent-langgraph:
    # Long-lived: comes back after a crash and after the host reboots. This deployment is
    # meant to stay up.
    restart: unless-stopped
    build:
      context: .
      dockerfile: agent-langgraph/Dockerfile
    ports:
      # Loopback, for the same reason as agent-bot above.
      - "127.0.0.1:${LANGGRAPH_PORT:-4201}:4201"
    environment:
      # The selected provider reads its own key. Models requiring the Responses API use
      # BOT_RESPONSES_API instead of changing the streaming loop here.
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      # Same server-to-Bot request boundary as agent-bot above.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      BOT_MODEL: ${BOT_MODEL:-gpt-5.5}
      BOT_RESPONSES_API: ${BOT_RESPONSES_API:-false}
      # Where this Bot runs a tool: back through the deployment that granted it, never at the vendor.
      # `host.docker.internal` because the API server runs on the host, not in this network.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4201/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent-cli-state:
  agent-cli-workspace:
  postgres-data:
  codex-state:
  codex-workspace:
  agent-workspace:
  spire-server-data:
  spire-server-socket:
  spire-agent-socket:
  spire-agent-data:
  agent-profiles:
  agent-artifacts:
